<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where Winds Meet Companion</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0b0b0b">
</head>

<body>

<header class="hero">

<div class="overlay">

<h1>WHERE WINDS MEET</h1>

<p>Companion v2.0</p>

<div class="progress-card">

<div class="circle">

<span id="progressPercent">0%</span>

</div>

<div class="progress-info">

<h2>Today's Progress</h2>

<p>
Complete your daily activities.
</p>

</div>

</div>

</div>

</header>

<nav class="bottom-nav">

<button class="nav-item active">
🏠
<span>Home</span>
</button>

<button class="nav-item">
✅
<span>Daily</span>
</button>

<button class="nav-item">
🗺️
<span>Explore</span>
</button>

<button class="nav-item">
👤
<span>Character</span>
</button>

<button class="nav-item">
⚙️
<span>Settings</span>
</button>

</nav>

<main>

<section class="dashboard">

<div class="card">

<h3>Completed</h3>

<p id="completedTasks">0</p>

</div>

<div class="card">

<h3>Remaining</h3>

<p id="remainingTasks">0</p>

</div>

<div class="card">

<h3>Daily Reset</h3>

<p id="resetTimer">Loading...</p>

</div>

<div class="card">

<h3>Streak</h3>

<p id="streak">1 Day</p>

</div>

</section>

<section class="menu-grid">

<div class="menu-card">📋 Daily Checklist</div>

<div class="menu-card">📅 Weekly Checklist</div>

<div class="menu-card">⚔ Boss Tracker</div>

<div class="menu-card">🗺 Exploration</div>

<div class="menu-card">🏆 Collections</div>

<div class="menu-card">🏰 Guild</div>

<div class="menu-card">📊 Statistics</div>

<div class="menu-card">⚙ Settings</div>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
