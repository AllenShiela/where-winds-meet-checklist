<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where Winds Meet Companion</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#111111">

</head>

<body>

<header class="hero">
    <h1>Where Winds Meet</h1>
    <p>Companion v3.0</p>
</header>

<main id="app">

<section id="home-page" class="page active">

<h2>Dashboard</h2>

<div class="dashboard">

<div class="card">
<h3>Progress</h3>
<p id="progressPercent">0%</p>
</div>

<div class="card">
<h3>Completed</h3>
<p id="completedTasks">0</p>
</div>

<div class="card">
<h3>Remaining</h3>
<p id="remainingTasks">0</p>
</div>

<div class="card">
<h3>Daily Reset</h3>
<p id="resetTimer">--:--:--</p>
</div>

</div>

</section>

<section id="daily-page" class="page">

<h2>Daily Checklist</h2>

<div class="menu-grid"></div>

</section>

<section id="weekly-page" class="page">

<h2>Weekly</h2>

<p>Coming Soon</p>

</section>

<section id="explore-page" class="page">

<h2>Explore</h2>

<p>Coming Soon</p>

</section>

<section id="guild-page" class="page">

<h2>Guild</h2>

<p>Coming Soon</p>

</section>

<section id="settings-page" class="page">

<h2>Settings</h2>

<p>Coming Soon</p>

</section>

</main>

<nav class="bottom-nav">

<button class="nav-item" data-page="home-page">
🏠
<span>Home</span>
</button>

<button class="nav-item" data-page="daily-page">
✅
<span>Daily</span>
</button>

<button class="nav-item" data-page="weekly-page">
📅
<span>Weekly</span>
</button>

<button class="nav-item" data-page="explore-page">
🗺️
<span>Explore</span>
</button>

<button class="nav-item" data-page="guild-page">
⚔️
<span>Guild</span>
</button>

<button class="nav-item" data-page="settings-page">
⚙️
<span>Settings</span>
</button>

</nav>

<script type="module" src="app.js"></script>

</body>
</html>
